{% extends "designer/account_shell.html" %}{% block account_content %}<h1>Edit Profile</h1><form method="post">{% csrf_token %}<label>First name<input name="first_name" value="{{ request.user.first_name }}" maxlength="150"></label><label>Last name<input name="last_name" value="{{ request.user.last_name }}" maxlength="150"></label><label>Email<input type="email" name="email" value="{{ request.user.email }}" required></label><button type="submit">Save Changes</button></form>{% endblock %}
