<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480">
<defs>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#31363d"/><stop offset=".22" stop-color="#d8dadd"/><stop offset=".48" stop-color="#686e75"/><stop offset=".72" stop-color="#eceeef"/><stop offset="1" stop-color="#30353b"/></linearGradient>
 <linearGradient id="strap" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fafafa"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#f2f2f2"/></linearGradient>
 <filter id="s" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="1440" height="480" fill="#fff"/>
<!-- Zenvibe-style continuous strap: 20 mm end + 120 mm front + 120 mm back + 20 mm end.
     Canvas registration: front x=360..720, back x=720..1080, y=340..415. -->
<ellipse cx="232" cy="240" rx="61" ry="61" fill="none" stroke="#17191c" stroke-width="12"/>
<ellipse cx="1208" cy="240" rx="61" ry="61" fill="none" stroke="#17191c" stroke-width="12"/>
<g fill="url(#metal)" stroke="#4c5157" stroke-width="3">
 <path d="M260 192h112v96H260l-38-22v-52z"/>
 <path d="M1068 192h112l38 22v52l-38 22h-112z"/>
 <circle cx="315" cy="212" r="9"/><circle cx="315" cy="268" r="9"/>
 <circle cx="1125" cy="212" r="9"/><circle cx="1125" cy="268" r="9"/>
</g>
<rect x="320" y="202" width="800" height="75" rx="4" fill="#000" opacity=".12" filter="url(#s)"/>
<rect x="320" y="202" width="800" height="75" rx="3" fill="url(#strap)" stroke="#9ca3af" stroke-width="2"/>
<!-- physical section boundaries -->
<path d="M360 202v75M720 202v75M1080 202v75" stroke="#9ca3af" stroke-width="2"/>
<!-- subtle stitching -->
<path d="M326 209h788M326 270h788" stroke="#c7cbd0" stroke-width="1.5" stroke-dasharray="5 6"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
 <text x="540" y="324" font-size="26" fill="#30343a">front side</text>
 <text x="900" y="324" font-size="26" fill="#30343a">back side</text>
</g>
</svg>